<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:#e9ebef;padding:24px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;border-radius:38px;overflow:hidden;background:#000;border:10px solid #111;box-shadow:0 18px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;position:relative}
.phone.land{width:780px;height:390px}
.app{flex:1;padding:18px 18px;font-size:17px}
.cap{font:600 15px Roboto,Arial;color:#333;margin:0 0 10px 4px}
.kbd{position:relative}
.tb{display:flex;align-items:center;padding:2px 6px 0}
.tb .ia{height:30px;padding:0 12px;border-radius:15px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;margin-right:4px;background:linear-gradient(135deg,var(--acc),#8E5CF7)}
.tb .ic{flex:1;display:flex;justify-content:center}
.tb svg{width:20px;height:20px;fill:var(--mod)}
.strip{display:flex;align-items:center;padding:4px}
.strip div{flex:1;text-align:center;font-size:17px;color:var(--txt);padding:6px 0;border-radius:8px}
.strip .hl{background:var(--pill);font-weight:700}
.strip i{width:1px;height:22px;background:var(--hint);opacity:.4}
.keys{position:relative;padding:4px 3px}
.row{display:flex;position:relative}
.k{margin:0 3px;border-radius:var(--rad);display:flex;align-items:center;justify-content:center;position:relative;color:var(--txt);box-shadow:0 1.2px 0 var(--sh)}
.k.c{background:linear-gradient(var(--kt),var(--kb))}
.k.m{background:linear-gradient(var(--mt),var(--mb));color:var(--mod)}
.k.acc{background:var(--acc)!important;color:#fff}
.k svg{fill:currentColor}
.sub{position:absolute;bottom:7px;font-size:10px;letter-spacing:1.5px;color:var(--hint)}
.lang{position:absolute;right:10px;bottom:5px;font-size:10px;color:var(--hint)}.lang b{color:var(--txt);font-weight:400}
.balloon{position:absolute;z-index:5}
.panel{background:var(--panel);padding:4px 10px 8px;color:var(--ptxt)}
.panel h4{font-size:15px;display:flex;justify-content:space-between;align-items:center;height:38px}
.chips{display:flex;gap:6px;overflow:hidden;margin-bottom:6px}
.chip{white-space:nowrap;padding:7px 12px;border-radius:16px;background:var(--field);font-size:13.5px}
.chip.on{background:var(--acc);color:#fff}
.box{background:var(--field);border-radius:12px;padding:9px 12px;font-size:16px;margin-bottom:6px}
.box.in{border:1px solid var(--acc)}
.st{font-size:12.5px;color:var(--hint);padding:2px 4px}
.acts{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.pill{padding:8px 14px;border-radius:18px;background:var(--field);font-size:14px}
.pill.p{background:var(--acc);color:#fff;font-weight:700}
.statusbar{height:26px;color:#fff;font-size:13px;padding:5px 22px;display:flex;justify-content:space-between}
.light .statusbar{color:#000}
</style></head><body>

function rowsNum(){const d=(c,s)=>({t:'n',l:c,s,w:2.5});return[[d('1',''),d('2','ABC'),d('3','DEF'),{t:'m',l:'+',w:2.5}],[d('4','GHI'),d('5','JKL'),d('6','MNO'),{t:'nsp',w:2.5}],[d('7','PQRS'),d('8','TUV'),d('9','WXYZ'),{t:'bk',w:2.5}],[{t:'m',l:'ABC',w:2.5},d('0','+'),{t:'m',l:'*',w:2.5},{t:'en',w:2.5}]]}
