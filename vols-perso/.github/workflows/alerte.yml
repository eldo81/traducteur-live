name: Alerte vols
on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours 06:17 UTC (= Dakar)
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier les alertes
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SEATS_AERO_KEY: ${{ secrets.SEATS_AERO_KEY }}
        run: python3 vols.py alerte > resultats.txt
      - name: Ouvrir une issue si un prix est sous le seuil (= email GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s resultats.txt ]; then
            gh issue create --title "✈️ Alerte vol $(date +%F)" --body-file resultats.txt
          fi
