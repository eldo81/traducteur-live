<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Radar B2B a déménagé</title>
  <meta http-equiv="refresh" content="0; url=https://eldo81.github.io/radar-b2b/">
  <link rel="canonical" href="https://eldo81.github.io/radar-b2b/">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1220; color: #e6edf7;
      font: 16px/1.5 system-ui, sans-serif; padding: 16px; text-align: center; }
    a { color: #22c55e; font-weight: 700; }
  </style>
</head>
<body>
  <p>Radar B2B a sa propre adresse :<br><a href="https://eldo81.github.io/radar-b2b/">eldo81.github.io/radar-b2b</a></p>
  <script>
    // Retire l'ancien service worker de /prospect/ puis redirige.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs
        .filter((r) => r.scope.includes('/traducteur-live/prospect/'))
        .forEach((r) => r.unregister())).catch(() => {});
    }
    location.replace('https://eldo81.github.io/radar-b2b/');
  </script>
</body>
</html>
